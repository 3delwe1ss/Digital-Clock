<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Clock</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: #fff5fb;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(255, 0, 128, 0.22), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(255, 200, 0, 0.28), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255, 120, 200, 0.18), transparent 60%),
    linear-gradient(135deg, #fff8fc 0%, #fff3e6 100%);
  font-family: 'Inter', sans-serif;
  cursor: url('https://cdn-icons-png.flaticon.com/512/616/616408.png') 16 16, auto;
}

/* overlay grid halus */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 0, 128, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 0, 128, 0.04) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  text-align: center;
  padding: 50px 70px 45px;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.65);
  border: 1px solid rgba(255, 0, 128, 0.18);
  box-shadow:
    0 0 0 1px rgba(255, 200, 0, 0.12),
    0 20px 60px rgba(255, 0, 128, 0.12),
    0 0 90px rgba(255, 200, 0, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  animation: floatCard 7s ease-in-out infinite alternate;
  z-index: 10;
}

/* Responsive layar HP */
@media (max-width: 600px) {
  .container {
    padding: 30px 40px 30px;
    margin: 0 20px;
    width: calc(100% - 40px);
    max-width: 400px;
  }
  .clock {
    font-size: clamp(2.5rem, 15vw, 4rem);
  }
  .ampm {
    font-size: 0.9rem;
  }
  .date {
    font-size: 0.9rem;
  }
}

/* garis atas beranimasi magenta–kuning */
.container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #ff2e88, #ffcc00, #ff2e88, transparent);
  background-size: 200% 100%;
  animation: borderFlow 4s linear infinite;
  border-radius: 2px;
  box-shadow: 0 0 12px rgba(255, 46, 136, 0.45);
}

@keyframes borderFlow {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@keyframes floatCard {
  0%   { transform: translateY(0); }
  100% { transform: translateY(-10px); }
}

h2 {
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #d98a00;
  margin-bottom: 22px;
  text-shadow: 0 0 10px rgba(255, 204, 0, 0.45);
  transition: all 0.3s ease;
}

.clock {
  font-family: 'Space Grotesk', monospace;
  font-weight: 700;
  font-size: clamp(3.5rem, 12vw, 7rem);
  letter-spacing: 0.02em;
  line-height: 1;
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 4px;
  font-variant-numeric: tabular-nums;
  text-shadow:
    0 0 18px rgba(255, 46, 136, 0.35),
    0 0 40px rgba(255, 0, 128, 0.15);
  cursor: pointer; /* Menandakan jam bisa diklik */
  transition: transform 0.1s ease;
}

/* Efek saat jam dipencet */
.clock:active {
  transform: scale(0.98);
}

.clock .colon {
  animation: blink 1s steps(1) infinite;
  color: #ffb400;
  font-weight: 500;
  text-shadow: 0 0 12px rgba(255, 180, 0, 0.6);
}

@keyframes blink {
  50% { opacity: 0.3; }
}

.clock .segment {
  background: linear-gradient(180deg, #ff2e88 0%, #ff7a3d 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.ampm {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.25em;
  color: #d98a00;
  margin-top: 14px;
  text-shadow: 0 0 14px rgba(255, 200, 0, 0.6);
  cursor: pointer; /* Menandakan bisa diklik */
  display: inline-block;
  padding: 4px 12px;
  border-radius: 8px;
  transition: all 0.2s ease;
  user-select: none;
}

.ampm:hover {
  background: rgba(255, 180, 0, 0.1);
}

.ampm:active {
  transform: scale(0.95);
}

.date {
  font-family: 'Space Grotesk', sans-serif; /* ← Diubah dari Inter ke Space Grotesk */
  margin-top: 26px;
  padding-top: 22px;
  font-size: 1.05rem;
  color: #b0367a;
  font-weight: 600; /* Dibikin agak tebal biar tegas */
  letter-spacing: 0.05em; /* Jarak antar huruf sedikit direnggangkan */
  border-top: 1px solid rgba(255, 0, 128, 0.15);
  text-shadow: 0 0 10px rgba(255, 46, 136, 0.15);
}

.paw {
  position: absolute;
  width: 70px;
  height: 70px;
  background: url('https://cdn-icons-png.flaticon.com/512/616/616408.png') no-repeat center;
  background-size: contain;
  opacity: 0.22;
  animation: pawFloat 10s linear forwards;
  pointer-events: none;
  filter: drop-shadow(0 0 6px rgba(255, 46, 136, 0.5)) hue-rotate(300deg) saturate(1.6);
  z-index: 5;
}

@keyframes pawFloat {
  0%   { transform: translateY(0) scale(0.7) rotate(0deg); opacity: 0.25; }
  50%  { opacity: 0.4; }
  100% { transform: translateY(-110vh) scale(1.3) rotate(360deg); opacity: 0; }
}

/* Toast Notification untuk Copy */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #ff2e88;
  color: white;
  padding: 10px 20px;
  border-radius: 50px;
  font-size: 0.9rem;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(255, 46, 136, 0.4);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  z-index: 100;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>
  <div class="container">
    <h2 id="greeting">Sekarang Pukul</h2>
    
    <!-- Kita beri id="clockContainer" biar bisa diklik -->
    <div class="clock" id="clockContainer" title="Klik untuk copy waktu">
      <span class="segment" id="h">00</span>
      <span class="colon">:</span>
      <span class="segment" id="m">00</span>
      <span class="colon">:</span>
      <span class="segment" id="s">00</span>
    </div>
    
    <!-- Teks AM/PM sekarang bisa diklik -->
    <div class="ampm" id="ampm" title="Klik untuk ganti format 12/24 jam">AM</div>
    
    <div class="date" id="date">1 Januari 2025</div>
  </div>

  <!-- Notifikasi Copy -->
  <div class="toast" id="toast">Copied!</div>

<script>
let is24Hour = false;

function updateClock() {
  const now = new Date();

  let h = now.getHours();
  
  // 1. FITUR GREETING OTOMATIS
  let greetText = "Good Night 🌙";
  if (h >= 4 && h < 12) greetText = "Good Morning ☀️";
  else if (h >= 12 && h < 15) greetText = "Good Afternoon 🌤️";
  else if (h >= 15 && h < 18) greetText = "Good Evening 🌅";
  document.getElementById("greeting").textContent = greetText;

  // 2. FITUR FORMAT 12 / 24 JAM
  const ampm = h >= 12 ? "PM" : "AM";
  const ampmEl = document.getElementById("ampm");
  
  if (!is24Hour) {
    h = h % 12;
    h = h ? h : 12;
    ampmEl.textContent = ampm;
    ampmEl.style.opacity = "1";
  } else {
    ampmEl.textContent = "24H"; // Teks penanda kalau mode 24 jam
    ampmEl.style.opacity = "0.6";
  }

  const m = now.getMinutes().toString().padStart(2, "0");
  const s = now.getSeconds().toString().padStart(2, "0");

  document.getElementById("h").textContent = h.toString().padStart(2, "0");
  document.getElementById("m").textContent = m;
  document.getElementById("s").textContent = s;

  const months = [
    "Januari","Februari","Maret","April","Mei","Juni",
    "Juli","Agustus","September","Oktober","November","Desember"
  ];

  const day = now.getDate();
  const month = months[now.getMonth()];
  const year = now.getFullYear();

  document.getElementById("date").textContent = `${day} ${month} ${year}`;
}

// Jalankan jamnya
setInterval(updateClock, 1000);
updateClock();

// 3. FITUR KLIK AM/PM UNTUK GANTI FORMAT
document.getElementById("ampm").addEventListener("click", () => {
  is24Hour = !is24Hour;
  updateClock();
});

// 4. FITUR KLIK JAM UNTUK COPY
const clockContainer = document.getElementById("clockContainer");
const toast = document.getElementById("toast");
let toastTimeout;

clockContainer.addEventListener("click", () => {
  const timeString = clockContainer.textContent.trim().replace(/\s+/g, '');
  const fullTime = timeString + (is24Hour ? "" : " " + document.getElementById("ampm").textContent);

  navigator.clipboard.writeText(fullTime).then(() => {
    // Tampilkan notifikasi
    toast.textContent = `Copied: ${fullTime}`;
    toast.classList.add("show");
    
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove("show");
    }, 2000);
  }).catch(err => {
    console.error('Failed to copy: ', err);
  });
});

// --- EFEK CAKAR (PAW) TETAP SEPERTI ASLINYA ---
function createPaw(x = null, y = null) {
  const paw = document.createElement("div");
  paw.classList.add("paw");

  paw.style.left = (x !== null ? x : Math.random() * window.innerWidth) + "px";
  paw.style.top = (y !== null ? y : window.innerHeight) + "px";

  const size = 50 + Math.random() * 40;
  paw.style.width = size + "px";
  paw.style.height = size + "px";

  paw.style.animationDuration = (6 + Math.random() * 6) + "s";

  document.body.appendChild(paw);

  setTimeout(() => paw.remove(), 10000);
}

setInterval(() => createPaw(), 1200);

document.addEventListener("click", e => {
  // Cegah buat cakar baru kalau yang diklik adalah jam / tombol ampm
  if (e.target.closest('.clock') || e.target.closest('.ampm')) return;

  for (let i = 0; i < 3; i++) {
    setTimeout(() => createPaw(e.pageX + Math.random() * 40 - 20, e.pageY), i * 100);
  }
});
</script>
</body>
</html>
